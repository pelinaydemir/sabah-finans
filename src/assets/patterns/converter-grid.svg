<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- Çevirici arka planı · referans görselden yeniden çizildi.
       viewBox YOK: 1 birim = 1 CSS px. Böylece grid hücresi her kırılımda aynı boyuttadır
       (26,25 × 30 px — mobil çeviricideki ölçü); zemin geçişleri ise kutuya göre (%) uzar.
       Zemin: sol lacivert → sağ mavi, ortada koyu mavi odak, altta kararma.
       Çizgiler: #4A62F0, sağ üstte en parlak, sol alta doğru doğrusal söner. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#031C48"/>
      <stop offset=".5" stop-color="#04126E"/>
      <stop offset="1" stop-color="#041A84"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".45">
      <stop offset="0" stop-color="#02097B"/>
      <stop offset="1" stop-color="#02097B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#041851" stop-opacity="0"/>
      <stop offset="1" stop-color="#041851"/>
    </linearGradient>
    <pattern id="cell" width="26.25" height="30" patternUnits="userSpaceOnUse">
      <rect x="25.25" width="1" height="30" fill="#4A62F0"/>
      <rect y="29" width="26.25" height="1" fill="#4A62F0"/>
    </pattern>
    <!-- Çizgi parlaklığı: sağ üst köşede tam, sol alta doğru doğrusal ve yumuşak söner -->
    <linearGradient id="glow" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <mask id="fade" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="url(#glow)"/>
    </mask>
  </defs>
  <rect width="100%" height="100%" fill="url(#base)"/>
  <rect width="100%" height="100%" fill="url(#core)"/>
  <rect width="100%" height="100%" fill="url(#floor)"/>
  <rect width="100%" height="100%" fill="url(#cell)" mask="url(#fade)"/>
</svg>
